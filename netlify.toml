# Netlify Deployment Configuration for TruthLens Frontend
[build]
  base = "templates"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  # Single-page app fallback
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
