# Netlify Deployment Configuration for TruthLens Frontend
[build]
  base = "templates"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  # Proxy all API requests to the Render backend service
  from = "/api/*"
  to = "https://fake-news-detection-using-ml-real-time.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  # Single-page app fallback
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
